<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <style>
      .back-brand {
        font-family: Impact, 'Arial Black', 'Helvetica Neue', sans-serif;
        font-size: 54px;
        fill: #f0d78c;
        font-weight: bold;
        letter-spacing: 4px;
        text-anchor: middle;
      }
      .back-sub {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        fill: #c9a84a;
        font-weight: bold;
        letter-spacing: 6px;
        text-anchor: middle;
      }
    </style>

    <linearGradient id="home-backCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c313c" />
      <stop offset="50%" stop-color="#1e222b" />
      <stop offset="100%" stop-color="#111318" />
    </linearGradient>

    <linearGradient id="home-backMetalBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="30%" stop-color="#aa7c11" />
      <stop offset="70%" stop-color="#5c4308" />
      <stop offset="100%" stop-color="#b5942b" />
    </linearGradient>

    <linearGradient id="home-backInnerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4aad" />
      <stop offset="100%" stop-color="#0d2458" />
    </linearGradient>

    <pattern id="home-backDiamond" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#161920" />
      <path d="M24 4 L44 24 L24 44 L4 24 Z" fill="none" stroke="#aa7c11" stroke-width="1.4" opacity="0.55" />
      <path d="M24 14 L34 24 L24 34 L14 24 Z" fill="#1a4aad" opacity="0.35" />
      <circle cx="24" cy="24" r="3" fill="#d4af37" opacity="0.7" />
    </pattern>

    <filter id="home-backDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="580" height="830" rx="25"
        fill="url(#home-backCardBg)" stroke="url(#home-backMetalBorder)" stroke-width="14"
        filter="url(#home-backDropShadow)" />
  <rect x="24" y="24" width="552" height="802" rx="16"
        fill="none" stroke="url(#home-backInnerBlue)" stroke-width="3" opacity="0.85" />

  <rect x="48" y="48" width="504" height="754" rx="12"
        fill="url(#home-backDiamond)" stroke="url(#home-backMetalBorder)" stroke-width="3" />

  <rect x="78" y="78" width="444" height="694" rx="10"
        fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.45" />

  <g transform="translate(300, 390)">
    <circle r="92" fill="#1a1e26" stroke="url(#home-backMetalBorder)" stroke-width="5" />
    <circle r="74" fill="none" stroke="#1a4aad" stroke-width="3" opacity="0.85" />
    <circle r="62" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8" />
    <text y="12" class="back-brand">SF</text>
  </g>

  <text x="300" y="545" class="back-brand" style="font-size:30px;letter-spacing:1px;">SuperFumbbl</text>
  <text x="300" y="580" class="back-sub">PLAYER CARD</text>
</svg>
