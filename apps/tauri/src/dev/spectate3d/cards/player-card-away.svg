<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <!-- Feuilles de style pour la gestion globale des polices -->
    <style>
      .title-text { font-family: 'Impact', 'Arial Black', 'Helvetica Neue', sans-serif; font-size: 34px; fill: #ffffff; font-weight: bold; letter-spacing: 1.5px; }
      .subtitle-text { font-family: 'Arial', 'Helvetica', sans-serif; font-size: 20px; fill: #e0cda9; font-weight: bold; font-style: italic; letter-spacing: 0.5px; }
      .coin-val { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 28px; fill: #2d2202; font-weight: bold; text-anchor: middle; }
      .coin-lbl { font-family: 'Arial Black', sans-serif; font-size: 20px; fill: #473604; font-weight: bold; text-anchor: middle; }
      .placeholder-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #4d5668; font-weight: bold; text-anchor: middle; letter-spacing: 2px; }
      .placeholder-sub { font-family: 'Arial', sans-serif; font-size: 12px; fill: #383f4d; font-weight: bold; text-anchor: middle; }
      .stat-label { font-family: 'Arial Black', sans-serif; font-size: 30px; fill: #d4af37; font-weight: bold; text-anchor: middle; }
      .stat-value { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 44px; fill: #ffffff; font-weight: bold; text-anchor: middle; }
      .section-title { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 24px; fill: #d4af37; letter-spacing: 1px; }
      .section-subtitle { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 13px; fill: #aa7c11; letter-spacing: 1px; }
      .body-text { font-family: 'Arial', sans-serif; font-size: 20px; fill: #ffffff; font-weight: bold; }
      .body-sub { font-family: 'Arial', sans-serif; font-size: 14px; fill: #d3d3d3; }
      .player-card-skills {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 24px;
        font-weight: bold;
        color: #ffffff;
        line-height: 1.45;
        margin: 0;
        padding: 0;
        overflow-wrap: break-word;
        word-break: break-word;
      }
      .player-card-skills-base {
        margin: 0;
      }
      .player-card-skills-additional {
        margin: 10px 0 0 0;
        padding-top: 8px;
        border-top: 1px solid #3a4252;
        color: #d4af37;
      }
    </style>

    <!-- Dégradés de couleurs (Gradients) -->
    <linearGradient id="away-cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c313c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e222b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111318;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="away-metalBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#aa7c11;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#5c4308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b5942b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="away-innerCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8a0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a0000;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="away-bannerRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#99000c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cc0010;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#730007;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="away-coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c99700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a5c00;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="away-statBadgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2e37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15181e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="away-panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1d24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#252932;stop-opacity:1" />
    </linearGradient>

    <!-- Filtre pour les ombres portées -->
    <filter id="away-dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 1. FOND DE LA CARTE & BORDURE MÉTALLIQUE -->
  <rect x="10" y="10" width="580" height="830" rx="25" fill="url(#away-cardBg)" stroke="url(#away-metalBorder)" stroke-width="14" filter="url(#away-dropShadow)" />
  
  <!-- Filet rouge interne -->
  <rect x="24" y="24" width="552" height="802" rx="16" fill="none" stroke="url(#away-innerCrimson)" stroke-width="3" opacity="0.8" />
  
  <!-- 2. BANNIÈRE SUPÉRIEURE (NOM & RESTRICTION) -->
  <g filter="url(#away-dropShadow)">
    <path d="M 32,40 L 450,40 L 425,115 L 32,115 Z" fill="url(#away-bannerRed)" stroke="url(#away-metalBorder)" stroke-width="3" />
    <path d="M 32,40 L 45,77 L 32,115 Z" fill="#4a0000" />
    
    <!-- Textes Modifiables -->
    <text id="away-nom-position" x="65" y="82" class="title-text">BLITZER ORC</text>
    <text id="away-restriction-equipe" x="66" y="104" class="subtitle-text">0-4 Par Équipe</text>
  </g>

  <!-- 3. JETON DE COÛT (EN HAUT À DROITE) -->
  <g filter="url(#away-dropShadow)">
    <circle cx="515" cy="78" r="48" fill="url(#away-coinGrad)" stroke="#5c4308" stroke-width="3" />
    <circle cx="515" cy="78" r="41" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="5,3" />
    
    <!-- Textes Modifiables -->
    <text id="away-valeur-cout" x="515" y="82" class="coin-val">80 000</text>
    <text id="away-devise-cout" x="515" y="102" class="coin-lbl">PO</text>
  </g>

  <!-- 4. CADRE DE LA ILLUSTRATION / FIGURINE (VIDE) -->
  <g filter="url(#away-dropShadow)">
    <rect x="35" y="145" width="312" height="340" rx="12" fill="#161920" stroke="url(#away-metalBorder)" stroke-width="4" />
    <rect id="away-figurine-photo-frame" x="41" y="151" width="300" height="328" rx="8" fill="#1a1e26" />
  </g>

  <!-- 5. BLOC DES CARACTÉRISTIQUES (MA, ST, AG, PA, AV) -->
  <g filter="url(#away-dropShadow)">
    
    <!-- Mouvement (MA) -->
    <g transform="translate(420, 135)">
      <text x="0" y="20" class="stat-label">MA</text>
      <circle cx="0" cy="66" r="40" fill="url(#away-statBadgeGrad)" stroke="url(#away-metalBorder)" stroke-width="2" />
      <text id="away-stat-ma" x="0" y="80" class="stat-value">6</text>
    </g>

    <!-- Force (ST) -->
    <g transform="translate(506, 201)">
      <text x="0" y="20" class="stat-label">ST</text>
      <circle cx="0" cy="66" r="40" fill="url(#away-statBadgeGrad)" stroke="url(#away-metalBorder)" stroke-width="2" />
      <text id="away-stat-st" x="0" y="80" class="stat-value">3</text>
    </g>

    <!-- Agilité (AG) -->
    <g transform="translate(420, 267)">
      <text x="0" y="20" class="stat-label">AG</text>
      <circle cx="0" cy="66" r="40" fill="url(#away-statBadgeGrad)" stroke="url(#away-metalBorder)" stroke-width="2" />
      <text id="away-stat-ag" x="0" y="80" class="stat-value">3+</text>
    </g>

    <!-- Passe (PA) -->
    <g transform="translate(506, 334)">
      <text x="0" y="20" class="stat-label">PA</text>
      <circle cx="0" cy="66" r="40" fill="url(#away-statBadgeGrad)" stroke="url(#away-metalBorder)" stroke-width="2" />
      <text id="away-stat-pa" x="0" y="80" class="stat-value">4+</text>
    </g>

    <!-- Armure (AV) -->
    <g transform="translate(420, 400)">
      <text x="0" y="20" class="stat-label">AV</text>
      <circle cx="0" cy="66" r="40" fill="url(#away-statBadgeGrad)" stroke="url(#away-metalBorder)" stroke-width="2" />
      <text id="away-stat-ar" x="0" y="80" class="stat-value">10+</text>
    </g>
  </g>

  <!-- 6. PANNEAU DES COMPÉTENCES & TRAITS -->
  <g filter="url(#away-dropShadow)">
    <rect x="35" y="520" width="530" height="295" rx="12" fill="url(#away-panelGrad)" stroke="url(#away-metalBorder)" stroke-width="3" />
    
    <!-- En-tête du panneau -->
    <text x="55" y="548" class="section-title">SKILLS &amp; TRAITS</text>
    <line x1="36" y1="560" x2="564" y2="560" stroke="#313745" stroke-width="2" />
    
    <!-- Liste des compétences (retour à la ligne automatique) -->
    <foreignObject id="away-liste-competences" x="55" y="570" width="490" height="235">
      <div xmlns="http://www.w3.org/1999/xhtml" class="player-card-skills">
        <div class="player-card-skills-base">Blocage, Châtaigne</div>
        <div class="player-card-skills-additional">Garde</div>
      </div>
    </foreignObject>
  </g>

</svg>
