<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super FUMBBL</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0d0d; }
      /* Dans #app : Vue le remplace au montage. Visible avant le module. */
      #boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #0d0d0d; color: #e6e9ef;
        font: 15px/1.4 Inter, system-ui, sans-serif;
      }
      .boot-spinner {
        width: 48px; height: 48px; border-radius: 50%;
        border: 3px solid rgba(230, 233, 239, 0.18); border-top-color: #e6e9ef;
        animation: boot-spin 0.75s linear infinite;
      }
      #boot p { margin: 0; letter-spacing: 0.02em; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" role="status">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p id="boot-label">Loading…</p>
      </div>
    </div>
    <script>
      (function () {
        var lang = '';
        try {
          var saved = JSON.parse(localStorage.getItem('fumbbl40k.settings') || 'null');
          lang = saved && saved.language ? String(saved.language) : '';
        } catch (e) { lang = ''; }
        if (lang.toLowerCase().indexOf('fr') === 0) {
          var label = document.getElementById('boot-label');
          if (label) label.textContent = 'Chargement…';
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
